{{- if .Values.externalSecret.enabled }}
# Sourced from AWS Secrets Manager by the External Secrets Operator. The secret
# never appears in this repository, in values, or in the rendered manifest.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "api.fullname" . }}
  labels:
    {{- include "api.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecret.secretStoreRef.name }}
    kind: {{ .Values.externalSecret.secretStoreRef.kind }}
  target:
    name: {{ include "api.fullname" . }}-config
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: {{ .Values.externalSecret.remoteKey }}
{{- end }}
