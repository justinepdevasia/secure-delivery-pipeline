---
# Terraform validation with no AWS account, no credentials and no network calls.
#
# `terraform test` with mock_provider is the important half: the emulator does not
# enforce IAM, so an emulated apply proves the graph resolves and nothing about
# whether the policies are correctly scoped. These assertions prove that.
name: infra-test

on:
  pull_request:
    paths:
      - infra/**
      - .github/workflows/infra-test.yml
  push:
    branches: [main]
    paths:
      - infra/**
      - .github/workflows/infra-test.yml

permissions:
  contents: read

concurrency:
  group: infra-test-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: infra/aws

jobs:
  terraform:
    name: fmt, validate and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      - name: Format check
        run: terraform fmt -check -recursive

      - name: Init without a backend
        run: terraform init -backend=false -input=false

      - name: Validate
        run: terraform validate

      - name: Set up tflint
        uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2

      - name: Tflint
        run: |
          set -euxo pipefail
          tflint --init
          tflint --format compact

      - name: Terraform test with mocked providers
        run: |
          set -euo pipefail
          terraform test -verbose | tee terraform-test.log

      - name: Terraform summary
        if: always()
        run: |
          set -euo pipefail
          {
            echo "### Terraform"
            echo
            echo '```'
            if [[ -f terraform-test.log ]]; then
              grep -E "^(run |Success!|Failure!|Error:)" terraform-test.log \
                || tail -n 20 terraform-test.log
            else
              echo "terraform test did not run"
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload terraform test output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: terraform-test
          path: infra/aws/terraform-test.log
          if-no-files-found: warn
          retention-days: 7

  datadog:
    name: validate the datadog configuration
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/datadog
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      - name: Format check
        run: terraform fmt -check -recursive

      - name: Init without a backend
        run: terraform init -backend=false -input=false

      # Validate only. This configuration is never planned or applied: there is no
      # Datadog account, and every credential variable defaults to an empty string
      # precisely so that validation needs none.
      - name: Validate
        run: terraform validate

  static-analysis:
    name: checkov and trivy config
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkov
        uses: bridgecrewio/checkov-action@c3e106d5f8f4253a6de5110efb41a080f83db294 # v12.3135.0
        with:
          directory: infra
          framework: terraform
          # No blanket --soft-fail: real findings are fixed, and the handful that
          # do not apply carry an inline `#checkov:skip=` with a reason.
          soft_fail: false
          output_format: cli,sarif
          output_file_path: console,checkov.sarif

      - name: Upload checkov SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: checkov.sarif
          category: checkov

      - name: Trivy config scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: infra
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"
          trivyignores: .trivyignore.yaml
