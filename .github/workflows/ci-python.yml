---
name: ci-python

on:
  pull_request:
    paths:
      - services/api-python/**
      - .github/workflows/ci-python.yml
  push:
    branches: [main]
    paths:
      - services/api-python/**
      - .github/workflows/ci-python.yml

permissions:
  contents: read

concurrency:
  group: ci-python-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: services/api-python

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    name: lint and type check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api-python/requirements-dev.txt

      - name: Install locked dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check --output-format=github .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy strict
        run: mypy --strict

  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: services/api-python/requirements-dev.txt

      - name: Install locked dependencies
        run: pip install -r requirements-dev.txt

      - name: Pytest with coverage gate
        run: |
          set -euo pipefail
          pytest --junitxml=junit.xml | tee coverage.log

      - name: Write coverage summary
        if: always()
        run: |
          set -euo pipefail
          {
            echo "### Python coverage — ${{ matrix.python-version }}"
            echo
            echo '```'
            tail -n 15 coverage.log || echo "no coverage output captured"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-py${{ matrix.python-version }}
          path: |
            services/api-python/coverage.xml
            services/api-python/junit.xml
          if-no-files-found: warn
          retention-days: 7
