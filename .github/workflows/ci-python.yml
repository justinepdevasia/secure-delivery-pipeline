---
name: ci-python

on:
  pull_request:
    paths:
      - services/api-python/**
      - .github/workflows/ci-python.yml
      - .github/workflows/reusable-build-attest.yml
  push:
    branches: [main]
    paths:
      - services/api-python/**
      - .github/workflows/ci-python.yml
      - .github/workflows/reusable-build-attest.yml

permissions:
  contents: read

concurrency:
  group: ci-python-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: services/api-python

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    name: lint and type check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api-python/requirements-dev.txt

      - name: Install locked dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check --output-format=github .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy strict
        run: mypy --strict

  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: services/api-python/requirements-dev.txt

      - name: Install locked dependencies
        run: pip install -r requirements-dev.txt

      - name: Pytest with coverage gate
        run: |
          set -euo pipefail
          pytest --junitxml=junit.xml | tee coverage.log

      - name: Write coverage summary
        if: always()
        run: |
          set -euo pipefail
          {
            echo "### Python coverage — ${{ matrix.python-version }}"
            echo
            echo '```'
            tail -n 15 coverage.log || echo "no coverage output captured"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-py${{ matrix.python-version }}
          path: |
            services/api-python/coverage.xml
            services/api-python/junit.xml
          if-no-files-found: warn
          retention-days: 7

  build:
    name: build, scan, sign and verify
    needs: [lint, test]
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      pull-requests: write
    uses: ./.github/workflows/reusable-build-attest.yml
    with:
      service_path: services/api-python
      image_name: api-python
      # Forked PRs have no write token; build and scan, but skip push/sign/attest.
      push: ${{ !github.event.pull_request.head.repo.fork }}
