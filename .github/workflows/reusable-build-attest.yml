---
# Build, scan, push, SBOM, attest, sign — and then verify what was just produced.
# Step order is deliberate: nothing reaches a registry before Trivy has cleared it,
# and nothing downstream may use the digest until verification passes.
name: reusable-build-attest

on:
  workflow_call:
    inputs:
      service_path:
        description: Directory holding the service and its Dockerfile
        required: true
        type: string
      image_name:
        description: Image name under ghcr.io/OWNER/REPO/
        required: true
        type: string
      dockerfile:
        description: Dockerfile path relative to service_path
        required: false
        type: string
        default: Dockerfile
      push:
        description: Push, sign and attest. False on forked PRs, which have no token.
        required: false
        type: boolean
        default: true
    outputs:
      digest:
        description: Digest of the pushed image
        value: ${{ jobs.build.outputs.digest }}
      image:
        description: Registry reference without a tag
        value: ${{ jobs.build.outputs.image }}

permissions:
  contents: read

jobs:
  build:
    name: build, scan, sign and verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      image: ${{ steps.meta.outputs.image }}
    env:
      LOCAL_TAG: local/${{ inputs.image_name }}:ci
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve image reference
        id: meta
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}/${{ inputs.image_name }}"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build image locally (not pushed yet)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ inputs.service_path }}
          file: ${{ inputs.service_path }}/${{ inputs.dockerfile }}
          load: true
          push: false
          tags: ${{ env.LOCAL_TAG }}
          provenance: false
          build-args: |
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
            REVISION=${{ github.sha }}
            CREATED=${{ steps.meta.outputs.created }}
          cache-from: type=gha,scope=${{ inputs.image_name }}
          cache-to: type=gha,mode=max,scope=${{ inputs.image_name }}

      - name: Smoke test the image before it leaves the runner
        run: |
          set -euxo pipefail
          docker run --rm -d --name smoke -p 8000:8000 "$LOCAL_TAG"
          scripts/wait-for-endpoint.sh --url http://localhost:8000/healthz --timeout 60
          test "$(docker inspect --format '{{.Config.User}}' "$LOCAL_TAG")" = "65532:65532"

      - name: Container logs on failure
        if: failure()
        run: docker logs smoke || true

      - name: Stop the smoke container
        if: always()
        run: docker rm -f smoke || true

      - name: Trivy scan — a vulnerable image never reaches a registry
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.LOCAL_TAG }}
          format: sarif
          output: trivy-image.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          # Dated, justified suppressions only — see the file header.
          trivyignores: .trivyignore.yaml

      - name: Upload Trivy SARIF
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-${{ inputs.image_name }}
          path: trivy-image.sarif
          if-no-files-found: warn
          retention-days: 7

      - name: Log in to GHCR
        if: inputs.push
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image tagged by commit SHA
        id: push
        if: inputs.push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ inputs.service_path }}
          file: ${{ inputs.service_path }}/${{ inputs.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.image }}:${{ github.sha }}
          provenance: false
          build-args: |
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
            REVISION=${{ github.sha }}
            CREATED=${{ steps.meta.outputs.created }}
          cache-from: type=gha,scope=${{ inputs.image_name }}

      - name: Generate CycloneDX SBOM
        if: inputs.push
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ steps.meta.outputs.image }}@${{ steps.push.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Generate SPDX SBOM
        if: inputs.push
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ steps.meta.outputs.image }}@${{ steps.push.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest the SBOM against the digest
        if: inputs.push
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ steps.meta.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: sbom.cyclonedx.json
          push-to-registry: true

      - name: Attest SLSA build provenance against the digest
        if: inputs.push
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.meta.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Install cosign
        if: inputs.push
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the digest keylessly
        if: inputs.push
        run: |
          set -euxo pipefail
          cosign sign --yes \
            "${{ steps.meta.outputs.image }}@${{ steps.push.outputs.digest }}"

      - name: Verify what was just produced — fails closed
        if: inputs.push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          scripts/verify-supply-chain.sh \
            --image "${{ steps.meta.outputs.image }}" \
            --digest "${{ steps.push.outputs.digest }}" \
            --repo "${{ github.repository }}" \
            --json | tee verification.json

      - name: Supply chain summary
        if: always()
        run: |
          set -euo pipefail
          {
            echo "### Supply chain — ${{ inputs.image_name }}"
            echo
            echo "| field | value |"
            echo "| --- | --- |"
            echo "| image | \`${{ steps.meta.outputs.image }}\` |"
            echo "| digest | \`${{ steps.push.outputs.digest }}\` |"
            echo "| trivy gate | CRITICAL,HIGH, ignore-unfixed, pre-push |"
            echo
            echo '```json'
            cat verification.json 2>/dev/null || echo '{"note":"verification did not run"}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload SBOMs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ inputs.image_name }}
          path: |
            sbom.cyclonedx.json
            sbom.spdx.json
          if-no-files-found: warn
          retention-days: 30
