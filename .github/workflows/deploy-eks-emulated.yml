---
# Deploy to an EMULATED EKS cluster. Read the job and step names literally: this
# repository has no AWS account and never talks to one.
#
# Genuinely real here:
#   * the supply chain gate — cosign signature and GitHub attestations checked
#     against a digest, before anything is promoted or deployed. Fails closed.
#   * the Kubernetes API server — the emulator's EKS implementation runs real k3s
#   * the Helm release, the rollout, the smoke test and the rollback
#
# Emulated: the AWS control plane (ECR, EKS, Secrets Manager, IAM).
name: deploy-eks-emulated

on:
  workflow_dispatch:
    inputs:
      digest:
        description: Image digest to deploy. Defaults to the digest behind this ref's tag.
        required: false
        default: ""
  pull_request:
    paths:
      - charts/api/**
      - scripts/**
      - .github/workflows/deploy-eks-emulated.yml
      - .github/actions/setup-floci/**
  push:
    branches: [main]
    paths:
      - services/api-python/**
      - charts/api/**
      - scripts/**
      - .github/workflows/deploy-eks-emulated.yml
      - .github/actions/setup-floci/**

permissions:
  contents: read

concurrency:
  group: deploy-eks-emulated-${{ github.ref }}
  cancel-in-progress: false

env:
  CLUSTER_NAME: secure-delivery-pipeline-emulated
  NAMESPACE: default
  RELEASE: api
  SERVICE: api-api
  DEPLOYMENT: api-api
  SOURCE_IMAGE: ghcr.io/justinepdevasia/secure-delivery-pipeline/api-python
  ECR_REPOSITORY: secure-delivery-pipeline/api-python
  SECRET_ID: secure-delivery-pipeline/api-python

jobs:
  deploy-emulated:
    name: deploy to the emulated EKS cluster
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
      id-token: write
      attestations: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve the digest to deploy
        id: digest
        env:
          REQUESTED: ${{ inputs.digest }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # A commit that changes only charts or scripts builds no image of its
          # own, so the deploy falls back to the latest published digest — which
          # still has to clear the verification gate below.
          scripts/resolve-image-digest.sh \
            --image "$SOURCE_IMAGE" --tag "$GITHUB_SHA" --attempts 3 \
            --fallback-latest --package "${GITHUB_REPOSITORY#*/}/api-python"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Gate — verify the supply chain before anything else happens
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          scripts/verify-supply-chain.sh \
            --image "$SOURCE_IMAGE" \
            --digest "${{ steps.digest.outputs.digest }}" \
            --repo "$GITHUB_REPOSITORY" \
            --json | tee verification.json

      - name: Start the AWS emulator
        uses: ./.github/actions/setup-floci

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Create the emulated ECR repository
        id: ecr
        run: |
          set -euxo pipefail
          aws ecr create-repository --repository-name "$ECR_REPOSITORY" \
            --image-tag-mutability IMMUTABLE \
            --image-scanning-configuration scanOnPush=true >/dev/null
          uri="$(aws ecr describe-repositories --repository-names "$ECR_REPOSITORY" \
            --query 'repositories[0].repositoryUri' --output text)"
          registry="${uri%%/*}"
          aws ecr get-login-password | docker login --username AWS --password-stdin "$registry"
          echo "uri=${uri}" >> "$GITHUB_OUTPUT"

      - name: Promote the verified image into the emulated ECR, by digest
        id: promote
        env:
          # promote-image.sh verifies again before pushing — defence in depth, and
          # `gh attestation verify` needs a token to read the attestations.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          scripts/promote-image.sh \
            --source "$SOURCE_IMAGE" \
            --digest "${{ steps.digest.outputs.digest }}" \
            --target "${{ steps.ecr.outputs.uri }}" \
            --repo "$GITHUB_REPOSITORY" \
            --json | tee promotion.json

      - name: Create the emulated EKS cluster
        id: cluster
        run: |
          set -euxo pipefail
          vpc="$(aws ec2 create-vpc --cidr-block 10.77.0.0/16 --query Vpc.VpcId --output text)"
          subnet="$(aws ec2 create-subnet --vpc-id "$vpc" --cidr-block 10.77.1.0/24 \
            --query Subnet.SubnetId --output text)"
          role="$(aws iam create-role --role-name "${CLUSTER_NAME}-cluster" \
            --assume-role-policy-document '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"Service":"eks.amazonaws.com"},"Action":"sts:AssumeRole"}]}' \
            --query Role.Arn --output text)"
          aws eks create-cluster --name "$CLUSTER_NAME" --role-arn "$role" \
            --resources-vpc-config "subnetIds=${subnet}" >/dev/null

      - name: Wait for the cluster to become ACTIVE
        run: |
          set -euo pipefail
          deadline=$(( $(date +%s) + 420 ))
          until [[ "$(aws eks describe-cluster --name "$CLUSTER_NAME" \
                      --query cluster.status --output text)" == "ACTIVE" ]]; do
            if (( $(date +%s) > deadline )); then
              echo "cluster did not become ACTIVE within 420s" >&2
              exit 3
            fi
            sleep 10
          done
          aws eks update-kubeconfig --name "$CLUSTER_NAME"
          kubectl get nodes -o wide

      - name: Give the cluster a route to the emulated ECR registry
        run: |
          set -euxo pipefail
          # The emulator points k3s at the registry by container name, but the two
          # containers share only the default bridge, which has no DNS. A
          # user-defined network with an alias gives the kubelet a name it can
          # actually resolve — otherwise every pull is ErrImagePull.
          docker network create floci-registry >/dev/null 2>&1 || true
          docker network connect --alias floci-ecr-registry floci-registry \
            floci-ecr-registry 2>/dev/null || true
          docker network connect floci-registry \
            "floci-eks-${CLUSTER_NAME}" 2>/dev/null || true
          docker exec "floci-eks-${CLUSTER_NAME}" getent hosts floci-ecr-registry

      - name: Seed the configuration secret the service reads
        run: |
          set -euxo pipefail
          aws secretsmanager create-secret --name "$SECRET_ID" \
            --secret-string '{"environment":"emulated","order_page_size":"5","feature_orders_v2":"true"}' >/dev/null

      - name: Create the emulator credentials the pod uses
        run: |
          set -euo pipefail
          # Deliberately not in values-emulator.yaml: even a throwaway credential
          # does not belong in a committed file. IRSA replaces this in production.
          kubectl create secret generic emulator-aws-credentials \
            --namespace "$NAMESPACE" \
            --from-literal=AWS_ACCESS_KEY_ID=test \
            --from-literal=AWS_SECRET_ACCESS_KEY=test

      - name: Helm upgrade --install, by digest
        run: |
          set -euxo pipefail
          # The emulator is reachable from inside k3s on the host gateway address.
          endpoint="http://$(ip -4 route show default | awk '{print $3; exit}'):4566"
          helm upgrade --install "$RELEASE" ./charts/api \
            --namespace "$NAMESPACE" \
            --values charts/api/values-emulator.yaml \
            --set image.repository="${{ steps.ecr.outputs.uri }}" \
            --set image.digest="${{ steps.promote.outputs.digest }}" \
            --set env.awsEndpointUrl="$endpoint" \
            --wait --timeout 6m --atomic

      - name: Wait for the rollout
        run: |
          set -euo pipefail
          scripts/wait-for-rollout.sh \
            --deployment "$DEPLOYMENT" --namespace "$NAMESPACE" --timeout 300 --json \
            | tee rollout.json

      - name: Smoke test the deployed service
        run: |
          set -euo pipefail
          scripts/smoke-test.sh \
            --service "$SERVICE" --namespace "$NAMESPACE" --timeout 180 --json \
            | tee smoke.json

      - name: Roll back and collect evidence on failure
        if: failure()
        run: |
          set -uo pipefail
          helm history "$RELEASE" --namespace "$NAMESPACE" || true
          helm rollback "$RELEASE" --namespace "$NAMESPACE" --wait --timeout 3m \
            || echo "no previous revision to roll back to"
          scripts/collect-diagnostics.sh --namespace "$NAMESPACE" --release "$RELEASE" || true

      - name: Deployment summary
        if: always()
        run: |
          set -uo pipefail
          {
            echo "### Emulated EKS deployment"
            echo
            echo "The AWS control plane below is emulated inside this runner."
            echo "The signature check, the Kubernetes API server, the Helm release"
            echo "and the smoke test are real."
            echo
            echo "| stage | result |"
            echo "| --- | --- |"
            echo "| digest | \`${{ steps.digest.outputs.digest }}\` |"
            for f in verification.json promotion.json rollout.json smoke.json; do
              [[ -f "$f" ]] && echo "| ${f%.json} | \`$(jq -c '{ok}' "$f" 2>/dev/null || echo '{}')\` |"
            done
            echo
            for f in verification.json smoke.json; do
              [[ -f "$f" ]] || continue
              echo "<details><summary>${f}</summary>"
              echo
              echo '```json'
              jq . "$f" 2>/dev/null || cat "$f"
              echo '```'
              echo
              echo "</details>"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Emulator logs
        if: always()
        run: docker logs floci 2>&1 | tail -n 150

      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deploy-emulated-evidence
          path: |
            verification.json
            promotion.json
            rollout.json
            smoke.json
            diagnostics.tar.gz
          if-no-files-found: warn
          retention-days: 14
