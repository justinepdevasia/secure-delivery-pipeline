---
name: ci-scripts

on:
  pull_request:
    paths:
      - scripts/**
      - tools/**
      - .github/workflows/**
  push:
    branches: [main]
    paths:
      - scripts/**
      - tools/**
      - .github/workflows/**

permissions:
  contents: read

concurrency:
  group: ci-scripts-${{ github.ref }}
  cancel-in-progress: true

env:
  SHFMT_VERSION: v3.13.1
  SHFMT_SHA256: fb096c5d1ac6beabbdbaa2874d025badb03ee07929f0c9ff67563ce8c75398b1

jobs:
  bash:
    name: bash lint, format and unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install shfmt (pinned, checksum verified)
        run: |
          set -euxo pipefail
          url="https://github.com/mvdan/sh/releases/download/${SHFMT_VERSION}/shfmt_${SHFMT_VERSION}_linux_amd64"
          curl -fsSLo /tmp/shfmt "$url"
          echo "${SHFMT_SHA256}  /tmp/shfmt" | sha256sum -c -
          sudo install -m 0755 /tmp/shfmt /usr/local/bin/shfmt

      - name: Install bats
        uses: bats-core/bats-action@77d6fb60505b4d0d1d73e48bd035b55074bbfb43 # 4.0.0
        with:
          support-install: false
          assert-install: false
          detik-install: false
          file-install: false

      - name: Assert scripts are executable
        run: |
          set -euo pipefail
          missing=0
          for script in scripts/*.sh; do
            test -x "$script" || { echo "not executable: $script"; missing=1; }
          done
          exit "$missing"

      - name: Shellcheck
        run: shellcheck --severity=style scripts/*.sh scripts/lib/*.sh

      - name: Shfmt
        run: shfmt -d -i 2 -ci scripts/

      - name: Bats unit tests
        run: |
          set -euo pipefail
          bats --formatter tap scripts/tests/ | tee bats.tap

      - name: Enforce the repository's own action pinning rule
        run: |
          set -euo pipefail
          scripts/audit-action-pins.sh --check --json | tee action-pins.json

      - name: Bash summary
        if: always()
        run: |
          set -euo pipefail
          {
            echo "### Bash"
            echo
            echo "| check | result |"
            echo "| --- | --- |"
            echo "| shellcheck --severity=style | ${{ job.status }} |"
            echo "| shfmt -d -i 2 -ci | ${{ job.status }} |"
            echo "| bats | $(grep -c '^ok ' bats.tap || echo 0) passed, $(grep -c '^not ok ' bats.tap || echo 0) failed |"
            echo "| action pins | $(jq -r '.scanned' action-pins.json) scanned, $(jq -r '.unpinned' action-pins.json) unpinned |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload bats output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bats-tap
          path: bats.tap
          if-no-files-found: warn
          retention-days: 7

  python:
    name: python tooling lint, type check and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/pyproject.toml

      - name: Install pipeline-tools
        run: pip install -e '.[dev]'

      - name: Ruff lint
        run: ruff check --output-format=github .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy strict
        run: mypy --strict

      - name: Pytest with coverage gate
        run: |
          set -euo pipefail
          pytest | tee coverage.log

      - name: Audit this repository's workflows with its own auditor
        working-directory: .
        run: |
          set -euo pipefail
          workflow-audit .github/workflows --json | tee workflow-audit.json

      - name: Python summary
        if: always()
        run: |
          set -euo pipefail
          {
            echo "### pipeline-tools"
            echo
            echo '```'
            tail -n 12 coverage.log || echo "no coverage output captured"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload tooling reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pipeline-tools-reports
          path: |
            tools/coverage.xml
            workflow-audit.json
          if-no-files-found: warn
          retention-days: 7
