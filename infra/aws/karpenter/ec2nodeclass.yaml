---
# How Karpenter builds a node. Subnets and security groups are discovered by tag,
# which is why vpc.tf tags the private subnets with karpenter.sh/discovery.
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default
spec:
  amiFamily: AL2023
  amiSelectorTerms:
    - alias: al2023@latest
  role: secure-delivery-pipeline-production-node
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: secure-delivery-pipeline-production
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: secure-delivery-pipeline-production
  metadataOptions:
    # IMDSv2 required and a hop limit of 1: a compromised pod cannot reach the
    # instance metadata service to steal the node role's credentials.
    httpEndpoint: enabled
    httpProtocolIPv6: disabled
    httpPutResponseHopLimit: 1
    httpTokens: required
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 50Gi
        volumeType: gp3
        encrypted: true
        deleteOnTermination: true
  tags:
    Project: secure-delivery-pipeline
    ManagedBy: karpenter
